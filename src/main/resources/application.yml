server:
  port: 8080
  servlet:
    context-path: /psd2

spring:
  application:
    name: push-notification-api-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:pushnotificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # OAuth2 Resource Server JWT — uncomment and configure for production:
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: https://your-auth-server.com/realms/openfinance

# Push notification client config
push-notification:
  client:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-retries: 3
    retry-delay-ms: 1000

# Springdoc/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    org.berlingroup.openfinance: DEBUG
    org.springframework.security: INFO
